<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hồ sơ — English Adventure</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="side-brand"><span>🦊</span> English Adventure</div>
    <a href="learn.html" class="side-link"><span class="ic">🏠</span> Học tập</a>
    <a href="profile.html" class="side-link active"><span class="ic">👤</span> Hồ sơ & Huy hiệu</a>
    <a href="index.html" class="side-link"><span class="ic">🚪</span> Trang chủ</a>
  </aside>

  <div>
    <div class="topbar">
      <div class="pill streak">🔥 <span id="pill-streak">0</span></div>
      <div class="pill hearts">❤️ <span id="pill-hearts">5</span></div>
      <div class="pill xp">⭐ <span id="pill-xp">0</span> XP</div>
    </div>

    <main class="main-content">
      <div class="profile-header">
        <div class="avatar-circle">🦊</div>
        <div>
          <h1 class="page-title" id="p-name">Học sinh</h1>
          <p class="page-sub" style="margin-bottom:0;">Level <span id="p-level">1</span> · <span id="p-lessons">0</span> bài đã hoàn thành</p>
        </div>
      </div>

      <div class="card">
        <h3>🏅 Huy hiệu</h3>
        <div class="badge-grid" id="badge-grid"></div>
      </div>

      <div class="card">
        <h3>🦊 Nhân vật</h3>
        <div class="char-grid" id="char-grid"></div>
      </div>

      <div class="card">
        <h3>⚙️ Dữ liệu học tập</h3>
        <p style="color:var(--ink-soft); font-size:0.9rem; margin-bottom:14px;">Tiến độ của bạn được lưu ngay trên trình duyệt này (localStorage).</p>
        <button class="btn btn-ghost" id="reset-btn">Xoá tiến độ & bắt đầu lại</button>
      </div>
    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
